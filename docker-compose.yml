version: '3.8'

services:
  db:
    image: postgres:15-alpine # Using PostgreSQL 15
    container_name: taf_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=\${DB_NAME:-taf_db}
      - POSTGRES_USER=\${DB_USER:-taf_user}
      - POSTGRES_PASSWORD=\${DB_PASSWORD:-taf_password} # Use environment variables for sensitive data
    ports:
      - "5432:5432" # Expose PostgreSQL port only if needed externally, otherwise only link to web service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \${DB_USER:-taf_user} -d \${DB_NAME:-taf_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: taf_web
    command: sh -c "/entrypoint.sh" # Use the entrypoint script
    volumes:
      - .:/app # Mount current directory to /app in container (for development, reflect code changes)
      - static_volume:/app/staticfiles # For static files collected by Django
      - media_volume:/app/media # For user uploaded media files
      - backups_volume:/app/backups # For backups generated by manage.py commands
    ports:
      - "8000:8000" # Expose Django app's port
    environment:
      - DEBUG=\${DEBUG:-1} # Set to 0 for production
      - SECRET_KEY=\${SECRET_KEY:-your_very_secret_django_key_in_prod} # CHANGE THIS IN PRODUCTION
      - ALLOWED_HOSTS=\${ALLOWED_HOSTS:-localhost 127.0.0.1 [::1]} # Adjust for production
      - DB_HOST=db # Service name of the database container
      - DB_NAME=\${DB_NAME:-taf_db}
      - DB_USER=\${DB_USER:-taf_user}
      - DB_PASSWORD=\${DB_PASSWORD:-taf_password}
      - DB_PORT=5432
      # Superuser creation env vars for entrypoint (if that part is enabled)
      # - DJANGO_SUPERUSER_USERNAME=\${DJANGO_SUPERUSER_USERNAME:-admin}
      # - DJANGO_SUPERUSER_EMAIL=\${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      # - DJANGO_SUPERUSER_PASSWORD=\${DJANGO_SUPERUSER_PASSWORD:-adminpass}
    depends_on:
      db:
        condition: service_healthy # Wait for db to be healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: taf_nginx
    ports:
      - "80:80" # Public port
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # Mount Nginx configuration
      - static_volume:/app/staticfiles # Serve static files from this volume
      - media_volume:/app/media # Serve media files from this volume
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
  backups_volume:
