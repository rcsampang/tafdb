user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '\$remote_addr - \$remote_user [\$time_local] "\$request" '
                      '\$status \$body_bytes_sent "\$http_referer" '
                      '"\$http_user_agent" "\$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # server_tokens off; # Hide Nginx version

    # gzip on;
    # gzip_vary on;
    # gzip_proxied any;
    # gzip_comp_level 6;
    # gzip_buffers 16 8k;
    # gzip_http_version 1.1;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream django_server {
        # Use the service name 'web' and port Gunicorn is running on
        server web:8000;
    }

    server {
        listen 80;
        server_name \${NGINX_SERVER_NAME:-localhost}; # Use env var for server_name or default to localhost

        location /static/ {
            alias /app/staticfiles/; # Path matches static_volume mount in nginx service
            expires 30d;
            add_header Cache-Control "public";
        }

        location /media/ {
            alias /app/media/; # Path matches media_volume mount in nginx service
            expires 30d;
            add_header Cache-Control "public";
        }

        location / {
            proxy_pass http://django_server;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header Host \$host;
            proxy_redirect off;
            # If using WebSockets:
            # proxy_http_version 1.1;
            # proxy_set_header Upgrade \$http_upgrade;
            # proxy_set_header Connection "upgrade";
        }
    }
}
